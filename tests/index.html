<script>
/* Unit tests for Block 1. Open this page (double click or server) — every line must be green.
   Numerical references: normal quantiles and truncation intensities from standard tables;
   Hayman–Jinks and Griffing values were cross-checked by an independent reconstruction (validation/block1). */
(async function () {
  const out = document.getElementById('out');
  let pass = 0, fail = 0;
  const section = t => out.insertAdjacentHTML('beforeend', `<h2>${t}</h2>`);
  function check(name, cond, detail) {
    if (cond) pass++; else fail++;
    out.insertAdjacentHTML('beforeend', `<div class="t ${cond ? 'ok' : 'bad'}">${cond ? '✓' : '✗'} ${name}${detail != null ? ' — ' + detail : ''}</div>`);
  }
  const near = (a, b, tol) => Math.abs(a - b) <= (tol == null ? 1e-9 : tol);

  section('Language and theme');
  /* remember the stored preferences so the tests leave the app exactly as they found it */
  const saved = {};
  try { saved.lang = localStorage.getItem('breedingpro:lang'); saved.theme = localStorage.getItem('breedingpro:theme'); } catch (e) { /* ignore */ }
  const savedAttr = document.documentElement.getAttribute('data-theme');
  window.addEventListener('load', () => {
    try {
      saved.lang == null ? localStorage.removeItem('breedingpro:lang') : localStorage.setItem('breedingpro:lang', saved.lang);
      saved.theme == null ? localStorage.removeItem('breedingpro:theme') : localStorage.setItem('breedingpro:theme', saved.theme);
    } catch (e) { /* ignore */ }
    savedAttr == null ? document.documentElement.removeAttribute('data-theme') : document.documentElement.setAttribute('data-theme', savedAttr);
  });
  I18N.set('en'); check('T() returns English after I18N.set("en")', T('hola', 'hello') === 'hello');
  check('<html lang> follows the language', document.documentElement.lang === 'en');
  I18N.set('es'); check('T() returns Spanish after I18N.set("es")', T('hola', 'hello') === 'hola');
  check('T() accepts {es, en} objects', T({ es: 'uno', en: 'one' }) === 'uno');
  const before = Theme.current(); Theme.toggle(); const after = Theme.current(); Theme.toggle();
  check('Theme.toggle switches light/dark', before !== after && Theme.current() === before);

  check('p values in running text: "p = 0.0123", and "p < 0.0001" without an equals sign',
    pEq(0.012345) === 'p = 0.0123' && pEq(0.00001) === 'p < 0.0001' && pEq(NaN) === 'p = —');

  section('Random numbers');
  const r1 = rng(42), r2 = rng(42), a = [], b = [];
  for (let i = 0; i < 5; i++) { a.push(r1()); b.push(r2()); }
  check('seeded generator is reproducible', a.every((x, i) => x === b[i]));
  const r3 = rng(7); let m = 0, v = 0; const N = 200000;
  for (let i = 0; i < N; i++) { const z = randn(r3); m += z; v += z * z; }
  m /= N; v = v / N - m * m;
  check('randn mean ≈ 0 and variance ≈ 1', Math.abs(m) < 0.01 && Math.abs(v - 1) < 0.015, `mean ${m.toFixed(4)}, var ${v.toFixed(4)}`);

  section('Normal quantile and selection intensity');
  check('qnorm(0.975) = 1.959964', near(Playground.qnorm(0.975), 1.959964, 1e-6));
  check('qnorm(0.001) = −3.090232', near(Playground.qnorm(0.001), -3.090232, 1e-6));
  [[0.5, 0.7979], [0.2, 1.3998], [0.1, 1.7550], [0.05, 2.0627], [0.01, 2.6652]].forEach(([p, i]) =>
    check(`i(${p}) = ${i} (Falconer & Mackay, Appendix Table A)`, near(Playground.intensity(p), i, 5e-4), Playground.intensity(p).toFixed(4)));

  section('Additive variance of the selection lab');
  check('one additive locus at p = ½: σ²A = 2pq·a² = 0.5', near(Playground.additiveVariance([0.5], 0), 0.5));
  check('complete dominance, p = 0.3: α = a + d(q − p) = 1.4, σ²A = 2·0.3·0.7·1.96', near(Playground.additiveVariance([0.3], 1), 2 * 0.3 * 0.7 * 1.96));
  check('fixed loci contribute nothing', near(Playground.additiveVariance([0, 1], 0.5), 0));

  section('Diallel lab (Hayman–Jinks and Griffing Method 2)');
  const d = Playground.simulateDiallel({ n: 7, loci: 12, da: 0.6, dir: 0.8, u: 0.45, eps: 0, err: 0.8 }, 12345);
  check('same numbers as the R validation: D', near(d.D, 17.081163999542614, 1e-8), d.D);
  check('H₁ (half-diallel correction)', near(d.H1, 7.665324034187725, 1e-8), d.H1);
  check('H₂ (half-diallel correction)', near(d.H2, 7.073228125092531, 1e-8), d.H2);
  check('b of Wr on Vr', near(d.b, 1.0901710281107029, 1e-9), d.b);
  check('MS GCA equals the least-squares fit', near(d.msG, 34.11732291701709, 1e-8), d.msG);
  check('GCA effects sum to zero', near(d.gca.reduce((s, x) => s + x, 0), 0, 1e-9));
  const d0 = Playground.simulateDiallel({ n: 6, loci: 10, da: 0, dir: 1, u: 0.5, eps: 0, err: 0 }, 99);
  check('no error, no dominance: E = 0 and H₁ ≈ 0', d0.E === 0 && Math.abs(d0.H1) < 1e-9, `H₁ = ${d0.H1}`);
  check('additive model: Baker ratio = 1', near(d0.baker, 1, 1e-9), d0.baker);
  const sym = d.M.every((row, i) => row.every((x, j) => x === d.M[j][i]));
  check('the table of means is symmetric', sym);

  section('Block 2 · crossing plans');
  const pnames = n => Array.from({ length: n }, (_, i) => 'P' + (i + 1));
  const counts = { 1: 36, 2: 21, 3: 30, 4: 15 };
  [1, 2, 3, 4].forEach(m => { const pl = Mating.build({ design: 'griffing', method: m, parents: pnames(6), checks: [] }); check(`Griffing method ${m} with 6 parents has ${counts[m]} entries`, pl.entries.length === counts[m], pl.entries.length); });
  [[8, 3], [9, 4], [10, 5], [11, 4], [12, 5], [13, 6]].forEach(([p, s]) => {
    const pl = Mating.build({ design: 'partial', parents: pnames(p), s, checks: [] });
    const per = pnames(p).map(x => pl.crosses.filter(c => c.female === x || c.male === x).length);
    const uniq = new Set(pl.crosses.map(c => [c.female, c.male].sort().join('|'))).size;
    check(`partial diallel p = ${p}, s = ${s}: ${p * s / 2} distinct crosses, every parent in ${s}`, pl.crosses.length === p * s / 2 && uniq === p * s / 2 && per.every(c => c === s));
  });
  check('partial diallel rejects p and s of the same parity', Mating.build({ design: 'partial', parents: pnames(8), s: 4, checks: [] }).errors.length > 0);
  const n2 = Mating.build({ design: 'nc2', m: 4, f: 5, sets: 2, checks: [] });
  check('North Carolina II, 2 sets of 4 × 5, gives 40 families', n2.entries.length === 40);
  const tt = Mating.build({ design: 'ttc', p1: 'A', p2: 'B', n: 10, source: 'F2', checks: [] });
  check('triple test cross with 10 F₂ plants gives 30 families, 10 per tester', tt.entries.length === 30 && ['L1', 'L2', 'L3'].every(k => tt.entries.filter(e => e.type === k).length === 10));
  const bud = Mating.budget(Mating.build({ design: 'griffing', method: 2, parents: pnames(4), checks: [] }), { seedsPerPlot: 50, reps: 2, locations: 2, safety: 0, seedsPerPollination: 100, success: 1, femaleUnitsPerPlant: 1, pollinationsPerMale: 5 });
  check('seed budget: 50 seeds × 2 reps × 2 locations = 200 seeds per entry, 2 pollinations per cross', bud.perEntry.every(x => x.seed === 200) && bud.totals.crossPollinations === 12 && bud.totals.selfPollinations === 8);

  section('Block 2 · field designs');
  const ent = Mating.build({ design: 'griffing', method: 2, parents: pnames(5), checks: ['C1'] }).entries;
  const rc = Field.generate(ent, { design: 'rcbd', reps: 3, locations: ['A', 'B'], seed: 5, plotsPerRow: 0, arrangement: 'stacked', numbering: 'serpentine' });
  const loc = rc.locations[0];
  const perRep = [1, 2, 3].every(rr => { const codes = loc.plots.filter(p => p.rep === rr).map(p => p.code); return codes.length === ent.length && new Set(codes).size === ent.length; });
  check('RCBD: every replicate holds every entry exactly once', perRep);
  check('plot numbers are unique and consecutive', new Set(loc.plots.map(p => p.plot)).size === loc.plots.length && Math.max(...loc.plots.map(p => p.plot)) === loc.plots.length);
  check('locations are randomised independently', rc.locations[0].plots.map(p => p.code).join() !== rc.locations[1].plots.map(p => p.code).join());
  check('RCBD error df = (r − 1)(t − 1)', rc.errorDf === 2 * (ent.length - 1));
  const rc2 = Field.generate(ent, { design: 'rcbd', reps: 3, locations: ['A', 'B'], seed: 5, plotsPerRow: 0, arrangement: 'stacked', numbering: 'serpentine' });
  check('the same seed reproduces the same field', rc2.locations[1].plots.map(p => p.code).join() === rc.locations[1].plots.map(p => p.code).join());
  const lat = Field.alphaDesign(25, 2, 5, 1);
  check('simple lattice 25 × 5 × 2: E = (k + 1)/(k + 3) = 0.75 and reaches the bound', Math.abs(lat.efficiency - 0.75) < 1e-9 && Math.abs(lat.upperBound - 0.75) < 1e-9, lat.efficiency);
  const lat3 = Field.alphaDesign(49, 3, 7, 1);
  check('triple lattice 49 × 7 × 3: E = 2(k + 1)/(2k + 5) = 16/19', Math.abs(lat3.efficiency - 16 / 19) < 1e-9, lat3.efficiency);
  const al = Field.alphaDesign(30, 3, 5, 11);
  check('alpha 30 × 5 × 3 at least as efficient as the reference series (0.784346, reference series)', al.efficiency >= 0.784346, al.efficiency);
  const aug = Field.generate(Mating.build({ design: 'lxt', lines: pnames(12), testers: ['T1', 'T2'], includeParents: false, checks: ['C1', 'C2', 'C3'] }).entries, { design: 'augmented', reps: 1, blocks: 4, locations: ['A'], seed: 3, plotsPerRow: 0, arrangement: 'stacked', numbering: 'rowwise' });
  const augOk = [1, 2, 3, 4].every(b => ['C1', 'C2', 'C3'].every(c => aug.locations[0].plots.filter(p => p.rep === b && p.code === c).length === 1));
  check('augmented design: every check in every block, new entries once', augOk && aug.locations[0].plots.filter(p => p.type !== 'check').length === 24);

  section('Block 2 · precision and power (values from R: pf with ncp, and linear algebra)');
  check('non-central F power d1 = 5, d2 = 40, λ = 12.5 equals R 0.7217577', Math.abs(S.powerF(12.5, 5, 40, 0.05) - 0.7217577143) < 1e-6);
  check('non-central F cdf d1 = 28, d2 = 100, λ = 60 at 2.5 equals R 0.1823168', Math.abs(S.pnf(2.5, 28, 100, 60) - 0.1823167738) < 1e-6);
  const T6 = Precision.griffingTable(6);
  check('Griffing method 2, p = 6: Var(ŝᵢⱼ) = (p² + p + 2)/((p + 1)(p + 2)) σ²', Math.abs(T6[2].vsij - 44 / 56) < 1e-12);
  check('Griffing method 3, p = 6: Var(ŝᵢⱼ − ŝₖₗ) = (p − 4)/(p − 2) σ²', Math.abs(T6[3].dskl - 0.5) < 1e-12);
  const pd = Precision.partial({ p: 8, s: 3, r: 2, L: 1, sigma2e: 2, alpha: 0.05 });
  check('partial diallel p = 8, s = 3: Var(ĝᵢ − ĝⱼ) = 0.875, 1.25, 1.875, 2.0 σ² by distance', [0.875, 1.25, 1.875, 2].every((vv, i) => Math.abs(pd.distances[i].se * pd.distances[i].se - vv) < 1e-9));
  const lx = Precision.lxt({ l: 8, t: 3, r: 3, L: 1, sigma2e: 2, alpha: 0.05 });
  check('line × tester exact SE of a line GCA = √[(l − 1)σ²/(rlt)]', Math.abs(lx.effects[0].se - Math.sqrt(7 * 2 / 72)) < 1e-12);
  const al2 = Precision.generationAllocation({ gens: ['P1', 'P2', 'F1', 'F2', 'BC1', 'BC2'], total: 6000, h2F2: 0.6, dominanceRatio: 1 });
  const ses = Object.keys(al2.plants).map(g => al2.variances[g] / al2.plants[g]);
  check('plant allocation equalises the variances of the generation means (within rounding)', Math.max(...ses) / Math.min(...ses) < 1.02, ses.map(x => x.toFixed(5)).join(' '));

  section('Block 3 · reading and column roles');
  const tb = Data.table([['#BreedingPro fieldbook, mating=griffing, method=2, field=alpha, reps=2, k=6'], ['Localidad', 'Parcela', 'Repetición', 'Bloque', 'Fila', 'Columna', 'Entrada', 'Genotipo', 'Hembra', 'Macho', 'Tipo', 'Rendimiento'], ['A', 1, 1, 1, 1, 1, 3, 'P1 × P2', 'P1', 'P2', 'F₁ directa', '5,6']]);
  check('declaration line of a Block 2 field book is read', tb.meta && tb.meta.mating === 'griffing' && tb.meta.method === 2 && tb.meta.field === 'alpha' && tb.meta.k === 6);
  const gr = Data.guessRoles(tb).roles;
  check('Spanish field-book headers get their roles (entry number ignored, genotype kept)', gr.join(',') === 'env,plot,rep,block,row,col,ignore,entry,female,male,type,trait', gr.join(','));
  const grEn = Data.guessRoles(Data.table([['Location', 'Plot', 'Replicate', 'Block', 'Row', 'Column', 'Entry', 'Genotype', 'Female', 'Male', 'Type', 'Yield'], ['A', 1, 1, 1, 1, 1, 1, 'X', 'a', 'b', 'parent', 3]])).roles;
  check('English field-book headers get the same roles', grEn.join(',') === 'env,plot,rep,block,row,col,ignore,entry,female,male,type,trait', grEn.join(','));
  check('decimal comma is detected and read', Data.decimalOf(['5,6', '7,25', 'NA']) === 'comma' && Data.toNumber('5,6', 'comma') === 5.6 && Data.toNumber('1.234,5', 'comma') === 1234.5);
  check('missing-value tokens are missing, text is not a number', Data.toNumber('NA', 'point') === null && Data.toNumber('.', 'point') === null && isNaN(Data.toNumber('abc', 'point')));
  check('cross names are split: "1x3", "A × B", "L1/L2"; words with x are not', String(Data.splitCross('1x3')) === '1,3' && String(Data.splitCross('A × B')) === 'A,B' && String(Data.splitCross('L1/L2')) === 'L1,L2' && Data.splitCross('Maxima') === null);
  check('generation codes in Spanish and English', Data.genCode('RC1') === 'BC1' && Data.genCode('F₂') === 'F2' && Data.genCode('bc2') === 'BC2' && Data.genCode('P1') === 'P1');
  const wide = Data.reshapeLong({ header: ['Par1', 'Par2', 'E1B1', 'E1B2', 'E2B1', 'E2B2'], rows: [['1', '2', 10, 11, 12, 13]] }, [2, 3, 4, 5], { valueName: 'Yield' });
  check('wide → long splits names like E1B2 into two factors', wide.header.join(',') === 'Par1,Par2,E,B,Yield' && wide.rows.length === 4 && wide.rows[3].join(',') === '1,2,E2,2,13', wide.header.join(','));

  section('Block 3 · design recognition on the examples');
  const loadEx = id => {
    const ex = Examples.get(id), src = Examples.rows(id), table = Data.table(src.rows);
    const roles = Data.guessRoles(table).roles;
    if (ex.roles) Object.entries(ex.roles).forEach(([h, r]) => { const j = table.header.indexOf(h); if (j >= 0) roles[j] = r; });
    const ov = Object.assign({}, ex.override || {});
    if (table.meta) { ov.mating = ov.mating || table.meta.mating; ov.method = ov.method || table.meta.method; ov.field = ov.field || table.meta.field; }
    const ds = Data.build(table, roles, { separateSexes: ov.mating ? ['nc1', 'nc2', 'nc3', 'ttc', 'lxt'].includes(ov.mating) : undefined, nestFemales: ov.mating === 'nc1' });
    return { ex, ds, rec: Data.recognize(ds, ov), src };
  };
  const loaded = {};
  Examples.LIST.forEach(ex => {
    const L = loaded[ex.id] = loadEx(ex.id), x = ex.expect, m = L.rec.mating, f = L.rec.field;
    const ok = m.design === x.mating && f.design === x.field && (x.method == null || m.method === x.method) && (x.s == null || m.s === x.s) && (x.multiEnv == null || f.multiEnv === x.multiEnv) && (x.plantLevel == null || f.plantLevel === x.plantLevel);
    check(`${ex.id}: ${x.mating}${x.method ? ' ' + x.method : ''} in ${x.field}`, ok, `${m.design} ${m.method || ''} ${f.design}`);
  });
  check('partial diallel of the example is recognised as circulant (Kempthorne–Curnow, k = 2)', loaded.partial8.rec.mating.circulant === true && loaded.partial8.rec.mating.k === 2);
  check('nc2: males and females with the same codes stay different plants', loaded.nc2.rec.mating.females.length === 10 && loaded.nc2.rec.mating.males.length === 10 && loaded.nc2.ds.records.every(r => r.type !== 'parent'));
  check('lxt: 5 lines, 3 testers and 8 parents evaluated', loaded.lxt.rec.mating.lines.length === 5 && loaded.lxt.rec.mating.testers.length === 3 && loaded.lxt.rec.mating.parentsEvaluated === 8);
  check('simAlpha: 5 checks outside the diallel', loaded.simAlpha.rec.mating.checks.length === 5);

  section('Block 3 · field-design analysis against published values and R');
  const ss = (res, src) => { const r = res.anova.find(a => a.source === src); return r ? r.ss : NaN; };
  ['maize4', 'hayman54', 'partial8', 'lxt'].forEach(id => {
    const L = loaded[id], res = Trial.analyseEnv(L.ds, L.rec.field.envs[0], L.ds.traits[0], { heritability: false }), x = L.ex.expect.anova;
    const refEntry = id === 'lxt' ? 32552.93739 : x.entry, refRes = id === 'lxt' ? 6010.29798 : x.residual;
    const tol = L.ex.expect.tol || 1e-4;
    check(`${id}: replicates, entries and error sums of squares`, near(ss(res, 'rep'), x.rep, tol) && near(ss(res, 'entry'), refEntry, tol) && near(res.sse = res.anova.find(a => a.source === 'residual').ss, refRes, tol), `${ss(res, 'rep').toFixed(5)} / ${ss(res, 'entry').toFixed(5)} / ${res.sse.toFixed(5)}`);
  });
  const nc2r = Trial.analyseEnv(loaded.nc2.ds, loaded.nc2.rec.field.envs[0], loaded.nc2.ds.traits[0], { heritability: false });
  check('nc2: sets 847 836 and replicates within sets 144 345 (published ANOVA)', near(ss(nc2r, 'set'), 847836, 1) && near(ss(nc2r, 'repSet'), 144345, 1) && near(nc2r.mse, 18581, 1));
  const nc1r = Trial.analyseEnv(loaded.nc1.ds, loaded.nc1.rec.field.envs[0], loaded.nc1.ds.traits[0], { heritability: false });
  check('nc1 (plants within plots): plot error × 3 = 3.2072 and within-plot SS = 3.5533 (published)', near(nc1r.sse = nc1r.anova.find(a => a.source === 'residual').ss * 3, 3.2072, 1e-3) && near(nc1r.within.ss, 3.5533, 1e-3) && near(nc1r.within.F, 4.3325, 1e-3));
  check('nc1: entries nested in sets have estimable means', nc1r.means.every(m => m.estimable));
  const zr = Trial.run(loaded.dial2env.ds, loaded.dial2env.rec, 0, { heritability: false });
  check('dial2env per environment: blocks 1.587 and 7.400, error 8.708 and 4.535 (published)', near(ss(zr.envs[0], 'rep'), 1.587, 1e-3) && near(zr.envs[0].anova.find(a => a.source === 'residual').ss, 8.708, 1e-3) && near(ss(zr.envs[1], 'rep'), 7.4, 1e-3) && near(zr.envs[1].anova.find(a => a.source === 'residual').ss, 4.535, 1e-3));
  check('dial2env combined: blocks(env) 8.99, entries 981.53, entries × env 5.614, pooled error 13.24 with 28 df', near(ss(zr.combined, 'repEnv'), 8.9873, 1e-3) && near(ss(zr.combined, 'entry'), 981.5283, 1e-3) && near(ss(zr.combined, 'entryEnv'), 5.6143, 1e-3) && near(zr.combined.mse * 28, 13.2427, 1e-3) && zr.combined.dfe === 28);
  const mz = Trial.analyseEnv(loaded.maize4.ds, loaded.maize4.rec.field.envs[0], loaded.maize4.ds.traits[0], {});
  check('maize4: Tukey non-additivity SS 1249.998, F 4.98602 (independent reconstruction)', mz.tukey && near(mz.tukey.ss, 1249.997903, 1e-4) && near(mz.tukey.F, 4.986024, 1e-5));
  check('maize4: Shapiro–Wilk of residuals W 0.97607375, p 0.0761325 (independent reconstruction)', near(mz.shapiro.W, 0.97607375, 1e-7) && near(mz.shapiro.p, 0.07613249, 1e-6));
  check('maize4: REML with random entries σ²g 487.39028, σ²e 264.02431 (independent REML); balanced → Cullis H² = standard H²', near(mz.h2.sigma2g, 487.390281, 1e-3) && near(mz.h2.sigma2e, 264.024305, 1e-4) && near(mz.h2.cullis, mz.h2.standard, 1e-9));
  const sa = loaded.simAlpha, saE = sa.rec.field.envs.find(e => e.key === 'Chapultepec');
  const ar = Trial.analyseEnv(sa.ds, saE, sa.ds.traits[0], {});
  check('α-lattice REML: σ²blocks 0.14616857, σ²e 0.32537085 (independent REML)', near(ar.reml.components[0].sigma2, 0.1461685744, 1e-6) && near(ar.reml.sigma2e, 0.3253708462, 1e-6));

  section('Block 4 · Griffing: variance coefficients of the four methods (Griffing 1956, §1.5 of the notes)');
  /* a balanced complete diallel with arbitrary values: the standard errors must follow
     Griffing's coefficients exactly, whatever the data */
  const gcells = (p, method, seed) => {
    const r = rng(seed || 7), out = [];
    const M = Griffing.METHODS[method];
    for (let i = 0; i < p; i++) for (let j = 0; j < p; j++) {
      if (i === j && !M.selfs) continue;
      if (i > j && !M.recip) continue;
      out.push({ env: '', i, j, y: 50 + 10 * randn(r), w: 3 });
    }
    return out;
  };
  [5, 6, 8].forEach(p => [1, 2, 3, 4].forEach(method => {
    const mse = 6, r = 3, sigma = mse / r;
    const res = Griffing.analyse({ parents: pnames(p), cells: gcells(p, method, 11 * p + method), method, envs: [{ key: '', name: 'A', mse, dfe: 40, r }], F: 1 });
    const eff = res.main.effects;
    const v = x => (x.se * x.se) / sigma;
    const exp = {
      1: { g: (p - 1) / (2 * p * p), sii: (p - 1) * (p - 1) / (p * p), sij: (p * p - 2 * p + 2) / (2 * p * p), r: 0.5, mu: 1 / (p * p), m: (p - 1) / (2 * p * p), n: (p - 2) / (2 * p), dg: 1 / p, dsShare: (p - 1) / p, dsApart: (p - 2) / p, dm: 1 / p },
      2: { g: (p - 1) / (p * (p + 2)), sii: p * (p - 1) / ((p + 1) * (p + 2)), sij: (p * p + p + 2) / ((p + 1) * (p + 2)), mu: 2 / (p * (p + 1)), dg: 2 / (p + 2), dsShare: 2 * (p + 1) / (p + 2), dsApart: 2 * p / (p + 2) },

      4: { g: (p - 1) / (p * (p - 2)), sij: (p - 3) / (p - 1), mu: 2 / (p * (p - 1)), dg: 2 / (p - 2), dsShare: 2 * (p - 3) / (p - 2), dsApart: 2 * (p - 4) / (p - 2) },
    }[method];
    const sij = eff.sca.find(s => !s.self), sii = eff.sca.find(s => s.self);
    const dif = k => { const d = eff.diffs.find(x => x.key === k); return d ? d.se * d.se / sigma : NaN; };
    const checks = [['Var(ĝ)', v(eff.gca[0]), exp.g], ['Var(ŝᵢⱼ)', v(sij), exp.sij], ['Var(μ̂)', v(eff.mu), exp.mu],
      ['Var(ĝᵢ − ĝⱼ)', dif('gca'), exp.dg], ['Var(ŝᵢⱼ − ŝᵢₖ)', dif('scaShare'), exp.dsShare], ['Var(ŝᵢⱼ − ŝₖₗ)', dif('scaApart'), exp.dsApart]];
    if (exp.sii) checks.push(['Var(ŝᵢᵢ)', v(sii), exp.sii]);
    if (exp.r) checks.push(['Var(r̂ᵢⱼ)', v(eff.recip[0]), exp.r], ['Var(m̂ᵢ)', v(eff.maternal[0]), exp.m], ['Var(n̂ᵢⱼ)', v(eff.nonmaternal[0]), exp.n], ['Var(m̂ᵢ − m̂ⱼ)', dif('mat'), exp.dm]);
    const bad = checks.filter(c => !near(c[1], c[2], 1e-9));
    check(`method ${method}, p = ${p}: ${checks.length} variances follow Griffing's coefficients`, bad.length === 0, bad.map(c => `${c[0]} ${c[1].toFixed(6)} ≠ ${c[2].toFixed(6)}`).join('; '));
    /* the restrictions hold exactly */
    const sumG = eff.gca.reduce((s, g) => s + g.est, 0);
    let worst = 0;
    for (let i = 0; i < p; i++) {
      let s = 0;
      eff.sca.forEach(x => { if (x.i === i && x.j === i) s += (method === 2 ? 2 : 1) * x.est; else if (x.i === i || x.j === i) s += x.est; });
      worst = Math.max(worst, Math.abs(s));

    const cnt = new Map();
    ent.forEach(v => { if (v.i === v.j) return; const k = Math.min(v.i, v.j) + '|' + Math.max(v.i, v.j); cnt.set(k, (cnt.get(k) || 0) + 1); });
    const keep = new Set();
    ent.forEach((v, name) => {
      if (v.i === v.j) { if (M.selfs) keep.add(name); return; }
      const k = Math.min(v.i, v.j) + '|' + Math.max(v.i, v.j);
      if (M.recip || cnt.get(k) === 1 || v.i < v.j) keep.add(name);

    const drop = opts.drop || [];
    const sub = Object.assign({}, D, { records: D.records.filter(r => keep.has(r.entry) && !drop.includes(r.entry)) });

    !!mzMissPred && isFinite(mzMissPred.predictedGca) && mzMissPred.seGca > 0, mzMissPred ? `${mzMissPred.predictedGca.toFixed(2)} ± ${mzMissPred.seGca.toFixed(2)}` : '');
  const genM = mz4.main.genetic;
  check('maize4: σ²A = 4σ²GCA/(1 + F) = 323.745 and Baker ratio 0.5905 with F = 1',
    near(genM.s2A, 2 * mzComp('g'), 1e-9) && near(genM.s2A, 323.7452, 1e-3) && near(genM.baker, 0.5905, 1e-4));
  const genF0 = Griffing.genetic(mz4.main.components, { F: 0, r: 6, e: 1, plotMse: mz4.main.mse });
  check('with F = 0 the additive variance doubles and the dominance variance quadruples',
    near(genF0.s2A, 4 * mzComp('g'), 1e-9) && near(genF0.s2D, 4 * mzComp('s'), 1e-9));

  section('Block 5 · Hayman, Morley Jones and Gardner–Eberhart');
  /* the diallel table and the per-block tables of an example, as Block 5 builds them */
  const hjBuild = (id, opts) => {
    opts = opts || {};
    const L = loaded[id], D = L.ds, rec = L.rec;
    const parents = rec.mating.parents, ix = new Map(parents.map((x, k) => [x, k]));
    const ent = new Map();
    D.records.forEach(r => { const i = ix.get(r.female), j = ix.get(r.male); if (i == null || j == null) return; if (!ent.has(r.entry)) ent.set(r.entry, { i, j }); });
    const t = D.traits[opts.trait || 0];
    const E = rec.field.envs[0];
    const res = Trial.analyseEnv(D, E, t, { heritability: false, externalError: L.ex.external });
    const cells = [];
    res.means.forEach(m => { const v = ent.get(m.entry); if (v && isFinite(m.mean)) cells.push({ i: v.i, j: v.j, y: m.mean, w: res.mse != null ? (m.n || 1) : 1 }); });
    const blocks = [];
    if (res.mse != null) {
      const byRep = new Map();
      D.records.forEach(r => {
        if ((r.env || '') !== E.key) return;
        const v = ent.get(r.entry); if (!v) return;
        const y = t.y[r.k]; if (!isFinite(y)) return;
        const key = (E.blockAsRep ? r.block : r.rep) || '1';
        if (!byRep.has(key)) byRep.set(key, []);
        byRep.get(key).push({ i: v.i, j: v.j, y, w: 1 });
      });
      byRep.forEach((cs, key) => blocks.push({ key, cells: cs }));
    }
    return HJ.analyse(Object.assign({ cells, parents, mse: res.mse != null ? res.mse : res.mseMeans, dfe: res.dfe, r: res.mse != null ? res.harmonicReps : 1, blocks, alpha: 0.05 }, opts.analyse || {}));
  };

  const H = hjBuild('hayman54');

  const rHay = 2;
  const it = k => H.anova.items[k] * rHay;                  /* plot scale */
  check('hayman54: Hayman items a 277716.73, b1 30796.89, b2 34152.70, b3 37288.86, c 6739.13, d 12372.88 (published)',
    near(it('a'), 277716.734, 0.01) && near(it('b1'), 30796.885, 0.01) && near(it('b2'), 34152.703, 0.01) && near(it('b3'), 37288.857, 0.01) && near(it('c'), 6739.125, 0.01) && near(it('d'), 12372.875, 0.01),
    [it('a'), it('b1'), it('b2'), it('b3'), it('c'), it('d')].map(x => x.toFixed(2)).join(' / '));
  check('hayman54: b = b1 + b2 + b3 = 102238.44 and the degrees of freedom 7, 1, 7, 20, 7, 21',
    near(it('b'), 102238.445, 0.01) && [7, 1, 7, 20, 7, 21].every((v, i) => ['a', 'b1', 'b2', 'b3', 'c', 'd'].map(k => H.anova.df[k])[i] === v));
  const bl = k => H.anova.blockRows.find(x => x.item === k).ss;
  check('hayman54: the item × blocks interactions 10015.86, 389.82, 1803.25, 3241.19, 3625.38, 7184.63 add up to the blocks × entries error 26260.12 (computed independently)',
    near(bl('a'), 10015.859, 0.01) && near(bl('b1'), 389.823, 0.01) && near(bl('b2'), 1803.245, 0.01) && near(bl('b3'), 3241.190, 0.01) && near(bl('c'), 3625.375, 0.01) && near(bl('d'), 7184.625, 0.01)
    && near(['a', 'b1', 'b2', 'b3', 'c', 'd'].reduce((s, k) => s + bl(k), 0), 26260.117, 0.02));
  check('hayman54: F of the items against the pooled error 95.18 (a), 2.31 (c) and 1.41 (d) (published)',
    near(H.anova.rows[0].F, 95.1805, 0.001) && near(H.anova.rows.find(x => x.item === 'c').F, 2.3097, 0.001) && near(H.anova.rows.find(x => x.item === 'd').F, 1.4135, 0.001));
  check('hayman54: Hayman–Jinks statistics V0L0 10210.46, V1L1 2152.65, V0L1 1239.81, W0L01 3335.02 (computed independently)',
    near(H.stats.V0L0, 10210.46, 0.01) && near(H.stats.V1L1, 2152.65, 0.01) && near(H.stats.V0L1, 1239.81, 0.01) && near(H.stats.W0L01, 3335.02, 0.01));
  check('hayman54: E = MSE/r = 208.41 and components D 10002.05, F 6768.22, H1 4907.84, H2 3234.55, h² 6645.64 (computed independently)',
    near(H.E, 208.414, 0.01) && near(H.components.D, 10002.05, 0.01) && near(H.components.F, 6768.22, 0.01) && near(H.components.H1, 4907.84, 0.01) && near(H.components.H2, 3234.55, 0.01) && near(H.components.h2, 6645.64, 0.01));
  check('hayman54: Wr and Vr of the eight arrays (computed independently)',
    [4002.15, 1515.99, 7392.43, 3642.73, 1459.96, 3289.49, 3946.55, 1430.86].every((v, i) => near(H.stats.Wr[i], v, 0.01))
    && [3076.89, 571.50, 6657.72, 2652.88, 530.11, 1321.39, 2062.57, 348.14].every((v, i) => near(H.stats.Vr[i], v, 0.01)));
  check('hayman54: regression b = 0.931 (SE 0.087), t(b = 1) not significant, t² = 0.249 (computed independently)',
    near(H.regression.b, 0.931, 0.001) && near(H.regression.seb, 0.087, 0.001) && H.regression.p1 > 0.05 && near(H.regression.t2, 0.249, 0.001));
  check('hayman54: the full-table components are exactly Griffing Method 1 (a = GCA, b = SCA, c = maternal, d = non-maternal)', (() => {
    const g1 = gbuild('hayman54', 1), g3 = gbuild('hayman54', 3);
    const gs = (g, k) => { const x = g.main.anova.find(z => z.source === k); return x ? x.ss / g.main.r : NaN; };
    return near(H.anova.items.a, gs(g1, 'gca'), 1e-6) && near(H.anova.items.b, gs(g1, 'sca'), 1e-6)
      && near(H.anova.items.c, gs(g1, 'mat'), 1e-6) && near(H.anova.items.d, gs(g1, 'nonmat'), 1e-6)
      && near(H.anova.items.b3, gs(g3, 'sca'), 1e-6);
  })());

  /* Morley Jones (1965) Table 1: 4 × 4 half diallel of wheat yield */
  const JT = [[33.9, 42.0, 35.6, 38.7], [42.0, 31.0, 36.7, 39.1], [35.6, 36.7, 30.0, 34.5], [38.7, 39.1, 34.5, 32.8]];
  const jones = HJ.jonesItems(Float64Array.from(JT.flat()), 4);
  check('Morley Jones (1965) Table 1: a 27.17, b1 81.90, b2 18.31, b3 0.82, total 128.20 (published)',
    near(jones.a, 27.17, 0.005) && near(jones.b1, 81.90, 0.005) && near(jones.b2, 18.31, 0.005) && near(jones.b3, 0.82, 0.005) && near(jones.total, 128.20, 0.005),
    [jones.a, jones.b1, jones.b2, jones.b3].map(x => x.toFixed(3)).join(' / '));

  /* Gardner & Eberhart on lonnquist61 (entry means, error 7.10 with 60 df) */
  const GEx = hjBuild('lonnquist61');
  const geSS = (rows, k) => { const x = rows.find(z => z.source === k); return x ? x.ss : NaN; };
  check('lonnquist61: Analysis II gives h̄ 115.440, varieties 234.230, variety heterosis 59.720 and specific heterosis 63.781 (published)',
    near(geSS(GEx.ge2Anova, 'hbar'), 115.440, 0.001) && near(geSS(GEx.ge2Anova, 'v'), 234.230, 0.001) && near(geSS(GEx.ge2Anova, 'h'), 59.720, 0.001) && near(geSS(GEx.ge2Anova, 's'), 63.781, 0.001));
  check('lonnquist61: Analysis III gives parents 55.975 and GCA among crosses 237.975 (published)',
    near(geSS(GEx.ge3Anova, 'sp'), 55.975, 0.001) && near(geSS(GEx.ge3Anova, 'g'), 237.975, 0.001));
  const namesL = GEx.parents;
  const vOf = nm => GEx.ge2.v[namesL.indexOf(nm)].est, hOf = nm => GEx.ge2.h[namesL.indexOf(nm)].est, gOf = nm => GEx.ge3.g[namesL.indexOf(nm)].est;
  check('lonnquist61: μ̂_v 92.45 (SE 1.088), h̄ 5.19 (SE 1.287), v̂ and ĥ of the six varieties with SE 2.432 and 1.720 (published)',
    near(GEx.ge2.mu.est, 92.45, 1e-6) && near(GEx.ge2.mu.se, 1.087811, 1e-5) && near(GEx.ge2.hbar.est, 5.19, 1e-6) && near(GEx.ge2.hbar.se, 1.287116, 1e-5)
    && near(vOf('M'), -1.45, 1e-6) && near(vOf('B'), 4.15, 1e-6) && near(vOf('K2'), 3.75, 1e-6) && near(GEx.ge2.v[0].se, 2.432420, 1e-5)
    && near(hOf('M'), -1.475, 1e-6) && near(hOf('K2'), 4.5, 1e-6) && near(GEx.ge2.h[0].se, 1.719981, 1e-5));
  check('lonnquist61: ŝ_B:G = 4.81 with SE 2.064, and ĝ of Analysis III = −2.2, −0.025, −2.05, 0.9, −3.0, 6.375 with SE 1.216 (published)',
    near(GEx.ge2.s.find(s => namesL[s.i] === 'B' && namesL[s.j] === 'G').est, 4.81, 1e-6) && near(GEx.ge2.s[0].se, 2.063977, 1e-5)
    && near(gOf('M'), -2.2, 1e-6) && near(gOf('H'), -0.025, 1e-6) && near(gOf('G'), -2.05, 1e-6) && near(gOf('B'), 0.9, 1e-6) && near(gOf('K'), -3.0, 1e-6) && near(gOf('K2'), 6.375, 1e-6)
    && near(GEx.ge3.g[0].se, 1.216, 1e-3));
  check('the identity ĝⱼ = ½v̂ⱼ + ĥⱼ holds exactly, and b₂ = SS(parents) + GCA(Method 4) − GCA(Method 2)', (() => {
    const g2 = Griffing.analyse({ parents: namesL, cells: GEx.geCells.map(c => ({ env: '', i: c.i, j: c.j, y: c.y, w: 1 })), envs: [{ key: '', mse: GEx.E, dfe: 60, r: 1 }], method: 2, F: 1 });
    const g4 = Griffing.analyse({ parents: namesL, cells: GEx.geCells.map(c => ({ env: '', i: c.i, j: c.j, y: c.y, w: 1 })), envs: [{ key: '', mse: GEx.E, dfe: 60, r: 1 }], method: 4, F: 1 });
    const gss = (g, k) => { const x = g.main.anova.find(z => z.source === k); return x ? x.ss : NaN; };
    const rhs = GEx.anova.items.genic + gss(g4, 'gca') - gss(g2, 'gca');
    return GEx.geIdentity < 1e-10 && near(GEx.anova.items.b2, rhs, 1e-6) && near(gss(g2, 'gca'), GEx.anova.items.a, 1e-6) && near(gss(g4, 'sca'), GEx.anova.items.b3, 1e-6);
  })());

  /* the half-diallel error corrections, by simulation */
  check('half-diallel error corrections: with only error in the data the derived corrections leave H₁ and H₂ unbiased and the classical ones inflate them', (() => {
    const p = 6, E = 1, reps = 3000;
    const rr = rng(20260918);
    let sumDer = 0, sumCla = 0, sumDer2 = 0, sumCla2 = 0;
    for (let k = 0; k < reps; k++) {
      const sym = new Float64Array(p * p);
      for (let i = 0; i < p; i++) for (let j = i; j < p; j++) { const v = 50 + randn(rr) * Math.sqrt(E); sym[i * p + j] = v; sym[j * p + i] = v; }
      const st = HJ.stats(sym, p);
      const cd = HJ.components(st, E, { half: true });
      const cc = HJ.components(st, E, { half: true, classic: true });
      sumDer += cd.H1; sumCla += cc.H1; sumDer2 += cd.H2; sumCla2 += cc.H2;
    }
    const mDer = sumDer / reps, mCla = sumCla / reps, mDer2 = sumDer2 / reps, mCla2 = sumCla2 / reps;
    const biasH1 = 2 * E * (p - 1) / p, biasH2 = E * (2 - 4 * (p - 1) / (p * p));
    window.__halfCheck = { mDer, mCla, mDer2, mCla2, biasH1, biasH2 };
    return Math.abs(mDer) < 0.12 && Math.abs(mCla - biasH1) < 0.12 && Math.abs(mDer2) < 0.12 && Math.abs(mCla2 - biasH2) < 0.12;
  })(), (() => { const c = window.__halfCheck; return `H1: ${c.mDer.toFixed(3)} vs ${c.mCla.toFixed(3)} (bias ${c.biasH1.toFixed(3)}) · H2: ${c.mDer2.toFixed(3)} vs ${c.mCla2.toFixed(3)} (bias ${c.biasH2.toFixed(3)})`; })());
  check('with a full table (reciprocals averaged) the classical corrections are the unbiased ones', (() => {
    const p = 6, E = 1, reps = 3000;
    const rr = rng(777);
    let s1 = 0, s2 = 0;
    for (let k = 0; k < reps; k++) {
      const sym = new Float64Array(p * p);
      for (let i = 0; i < p; i++) for (let j = i; j < p; j++) {
        /* a self has variance E, a cross is the mean of two reciprocals: variance E/2 */
        const v = 50 + randn(rr) * Math.sqrt(i === j ? E : E / 2);
        sym[i * p + j] = v; sym[j * p + i] = v;
      }
      const st = HJ.stats(sym, p);
      const c = HJ.components(st, E, { half: false });
      s1 += c.H1; s2 += c.H2;
    }
    return Math.abs(s1 / reps) < 0.1 && Math.abs(s2 / reps) < 0.1;
  })());

  section('Block 6 · mating designs (North Carolina, triple test cross, line × tester, partial diallel)');
  /* the plot values of an example with the role of every entry, as Block 6 builds them */
  const mdBuild = (id, opts) => {
    opts = opts || {};
    const L = loaded[id], D = L.ds, rec = L.rec, M = rec.mating;
    const t = D.traits[opts.trait || 0];
    const ent = new Map(Data.entryTable(D).map(e => [e.name, e]));
    const E = rec.field.envs[0];
    const res = Trial.analyseEnv(D, E, t, { heritability: false, externalError: L.ex.external });
    const design = opts.design || M.design;
    const obs = [];
    res.plots.forEach(pl => {
      const e = ent.get(pl.entry);
      if (!e || e.type === 'check') return;
      const row = { env: '', set: pl.set || '', rep: pl.repKey, block: pl.blockKey, y: pl.y, n: pl.n, entry: pl.entry };
      if (design === 'nc1' || design === 'nc2') { if (!e.female || !e.male) return; row.male = e.male; row.female = e.female; }
      else if (design === 'lxt') { if (e.female && e.male && e.female !== e.male) { row.line = e.female; row.tester = e.male; } else row.parent = e.female || e.male || e.name; }
      else if (design === 'nc3' || design === 'ttc') { if (!e.female || !e.male) return; row.tester = M.testerIsFemale ? e.female : e.male; row.plant = M.testerIsFemale ? e.male : e.female; }
      else if (design === 'partial') { if (!e.female || !e.male || e.female === e.male) return; row.female = e.female; row.male = e.male; }
      if (opts.drop && opts.drop(row)) return;
      obs.push(row);
    });
    return MD.analyse(Object.assign({
      design, obs, parents: M.parents, testers: M.testers ? MD.orderTesters(M.testers) : null,
      strata: { rep: !(res.design === 'crd' || res.design === 'means'), block: ['alpha', 'ibd', 'augmented'].includes(res.design) },
      F: 0, alpha: 0.05, r: res.harmonicReps, e: 1,
    }, opts.analyse || {}));
  };
  const mdRow = (r, src) => r.rows.find(x => x.source === src) || {};
  const mdComp = (r, key) => (r.components || []).find(x => x.key === key) || {};
  const mdCoef = (r, src, key) => (r.coef && r.coef[src] && r.coef[src][key] != null ? r.coef[src][key] / mdRow(r, src).df : NaN);

  /* ---------------- North Carolina I ---------------- */
  const N1 = mdBuild('nc1');
  check('nc1: degrees of freedom 1 sets, 2 replicates, 4 males, 6 females within males, 10 error',
    mdRow(N1, 'set').df === 1 && mdRow(N1, 'rep').df === 2 && mdRow(N1, 'male').df === 4 && mdRow(N1, 'female').df === 6 && N1.dfe === 10,
    [mdRow(N1, 'set').df, mdRow(N1, 'rep').df, mdRow(N1, 'male').df, mdRow(N1, 'female').df, N1.dfe].join('/'));
  check('nc1: sums of squares 0.177963 sets, 0.996481 replicates, 7.390370 males, 1.608333 females, 1.069074 error (computed independently)',
    near(mdRow(N1, 'set').ss, 0.17796296, 1e-6) && near(mdRow(N1, 'rep').ss, 0.99648148, 1e-6) && near(mdRow(N1, 'male').ss, 7.39037037, 1e-6)
    && near(mdRow(N1, 'female').ss, 1.60833333, 1e-6) && near(N1.mse * N1.dfe, 1.06907407, 1e-6));
  check('nc1: expected mean squares σ²e + 2σ²f + 4σ²m for males and σ²e + 2σ²f for females (r = 2, f = 2)',
    near(mdCoef(N1, 'male', 'male'), 4, 1e-9) && near(mdCoef(N1, 'male', 'female'), 2, 1e-9)
    && near(mdCoef(N1, 'female', 'female'), 2, 1e-9) && Math.abs(mdCoef(N1, 'female', 'male')) < 1e-9);
  check('nc1: males are tested against females within males, and the sets against the males',
    mdRow(N1, 'male').denom === 'female' && mdRow(N1, 'female').denom === 'error' && mdRow(N1, 'set').denom === 'male');
  check('nc1: σ²m = (M_m − M_f)/4 and σ²f = (M_f − M_e)/2, with σ²A = 4σ²m and σ²D = 4(σ²f − σ²m)',
    near(mdComp(N1, 'male').value, (mdRow(N1, 'male').ms - mdRow(N1, 'female').ms) / 4, 1e-12)
    && near(mdComp(N1, 'female').value, (mdRow(N1, 'female').ms - N1.mse) / 2, 1e-12)
    && near(N1.genetic.s2A, 4 * mdComp(N1, 'male').value, 1e-12)
    && near(N1.genetic.s2D, 4 * (mdComp(N1, 'female').value - mdComp(N1, 'male').value), 1e-12));
  const N1F = mdBuild('nc1', { analyse: { F: 1 } });
  check('nc1: with inbred parents (F = 1) σ²A = 2σ²m and σ²D = σ²f − σ²m',
    near(N1F.genetic.s2A, 2 * mdComp(N1F, 'male').value, 1e-12) && near(N1F.genetic.s2D, mdComp(N1F, 'female').value - mdComp(N1F, 'male').value, 1e-12));

  /* ---------------- North Carolina II ---------------- */
  const N2 = mdBuild('nc2');
  check('nc2: degrees of freedom 1 set, 4 replicates, 8 males, 8 females, 32 interaction, 96 error',
    mdRow(N2, 'set').df === 1 && mdRow(N2, 'rep').df === 4 && mdRow(N2, 'male').df === 8 && mdRow(N2, 'female').df === 8 && mdRow(N2, 'maleFemale').df === 32 && N2.dfe === 96,
    [mdRow(N2, 'set').df, mdRow(N2, 'rep').df, mdRow(N2, 'male').df, mdRow(N2, 'female').df, mdRow(N2, 'maleFemale').df, N2.dfe].join('/'));
  check('nc2: error sum of squares 1 783 762.45 (published with the data) and sets 847 836.44',
    near(N2.mse * N2.dfe, 1783762.4535, 1e-3) && near(mdRow(N2, 'set').ss, 847836.4359, 1e-3),
    `${(N2.mse * N2.dfe).toFixed(4)} / ${mdRow(N2, 'set').ss.toFixed(4)}`);
  check('nc2: expected mean squares σ²e + 3σ²mf + 15σ²m for males and 15σ²f for females (r = 3, 5 × 5 inside each set)',
    near(mdCoef(N2, 'male', 'male'), 15, 1e-9) && near(mdCoef(N2, 'male', 'maleFemale'), 3, 1e-9)
    && near(mdCoef(N2, 'female', 'female'), 15, 1e-9) && Math.abs(mdCoef(N2, 'male', 'female')) < 1e-9);
  check('nc2: males and females against the interaction, and the sets against a Satterthwaite combination',
    mdRow(N2, 'male').denom === 'maleFemale' && mdRow(N2, 'female').denom === 'maleFemale' && mdRow(N2, 'set').denom === 'quasi' && near(mdRow(N2, 'set').dfDen, 12.8931468, 1e-4));
  check('nc2: σ²A = 2(σ²m + σ²f) and σ²D = 4σ²mf with F = 0',
    near(N2.genetic.s2A, 2 * (mdComp(N2, 'male').value + mdComp(N2, 'female').value), 1e-9)
    && near(N2.genetic.s2D, 4 * mdComp(N2, 'maleFemale').value, 1e-9));
  check('nc2: the general effects of every set add up to zero and share one standard error',
    N2.effects.every(e => Math.abs(e.rows.reduce((s, x) => s + x.est, 0)) < 1e-8 && Math.abs(e.cols.reduce((s, x) => s + x.est, 0)) < 1e-8)
    && near(N2.effects[0].rows[0].se, Math.sqrt(N2.mse * (1 / 15 - 1 / 75)), 1e-9),
    N2.effects[0].rows[0].se.toFixed(6));
  /* one missing cross: the analysis stays exact and the coefficients change */
  const N2miss = mdBuild('nc2', { drop: r => r.set === '1' && r.male === '♂1' && r.female === '♀1' });
  check('nc2 with one cross removed: 31 degrees of freedom for the interaction and coefficients that are no longer whole numbers',
    mdRow(N2miss, 'maleFemale').df === 31 && Math.abs(mdCoef(N2miss, 'male', 'male') - 15) > 1e-6 && isFinite(mdComp(N2miss, 'maleFemale').value),
    `${mdRow(N2miss, 'maleFemale').df} · ${mdCoef(N2miss, 'male', 'male').toFixed(6)}`);

  /* ---------------- North Carolina III ---------------- */
  const N3 = mdBuild('nc3');
  check('nc3: degrees of freedom 3 sets, 4 replicates, 12 plants, 1 tester, 3 testers × sets, 12 plants × testers, 28 error',
    mdRow(N3, 'set').df === 3 && mdRow(N3, 'rep').df === 4 && mdRow(N3, 'plant').df === 12 && mdRow(N3, 'tester').df === 1
    && mdRow(N3, 'testerSet').df === 3 && mdRow(N3, 'plantTester').df === 12 && N3.dfe === 28,

  /* ---------------- triple test cross (simulated with known parameters) ---------------- */
  const TT = mdBuild('simTTC');

  check(`simTTC: σ²A ${TT.sd.s2A.toFixed(2)} and σ²D ${TT.sd.s2D.toFixed(2)} are within two standard errors of the true 5.76 and 2`,

  check('simTTC: the additive contrast between the testers is tested against its interaction with the individuals',

  /* ---------------- line × tester ---------------- */
  const LT = mdBuild('lxt');

  check('lxt: lines 10 318.361, testers 1 718.926 and lines × testers 14 162.367 (computed independently)',

    [mdRow(LT, 'line').ss, mdRow(LT, 'tester').ss, mdRow(LT, 'lineTester').ss].map(x => x.toFixed(3)).join(' / '));

    near(mdCoef(LT, 'line', 'line'), 12, 1e-9) && near(mdCoef(LT, 'line', 'lineTester'), 4, 1e-9) && near(mdCoef(LT, 'tester', 'tester'), 20, 1e-9));
  check('lxt: the general effects add up to zero and Var(ĝ of a line) = σ²(1/rt − 1/rlt)',
    Math.abs(LT.effects[0].rows.reduce((s, x) => s + x.est, 0)) < 1e-8
    && near(LT.effects[0].rows[0].se, Math.sqrt(LT.mse * (1 / 12 - 1 / 60)), 1e-9)

  const LTF = mdBuild('lxt', { analyse: { F: 1 } });
  check('lxt: σ²D = 4σ²ACE/(1+F)² gives σ²ACE with inbred parents, not 2σ²ACE',

  check('lxt: heterosis of L3 × T8 is 39.700 with a standard error of 5.84375 (contrast of three means)',
    (() => {
      const h = LT.heterosis.find(x => x.row === 'L3' && x.col === 'T8');

    })());

  /* ---------------- partial diallel ---------------- */
  const PD = mdBuild('partial8');
  check('partial8: replicates 17.0744 (published) and the 20 crosses split into 7 + 12 degrees of freedom adding to 22.4388',
    near(mdRow(PD, 'rep').ss, 17.07441375, 1e-6) && mdRow(PD, 'gca').df === 7 && mdRow(PD, 'sca').df === 12

    mdCoef(PD, 'gca', 'gca').toFixed(8));
  check('partial8: σ²A = 4σ²ACG and the Baker ratio is 2σ²ACG/(2σ²ACG + σ²ACE)',
    near(PD.genetic.s2A, 4 * mdComp(PD, 'gca').value, 1e-12)
    && (!isFinite(PD.genetic.baker) || near(PD.genetic.baker, 2 * mdComp(PD, 'gca').value / (2 * mdComp(PD, 'gca').value + mdComp(PD, 'sca').value), 1e-12)));

  /* ---------------- the coefficients of a balanced design built by hand ---------------- */
  check('the traces reproduce the classical coefficients of a balanced factorial: r·f, r·m and r', (() => {
    const obs = [];
    const m = 4, f = 3, r = 5;
    for (let i = 1; i <= m; i++) for (let j = 1; j <= f; j++) for (let k = 1; k <= r; k++) obs.push({ env: '', set: '', rep: 'R' + k, male: 'M' + i, female: 'F' + j, y: i + 0.5 * j + 0.1 * k });
    const L = MD.layout('nc2', obs, {});
    const A = MD.anova(L, obs.map(x => x.y), {});

      && near(cf('maleFemale', 'maleFemale'), r, 1e-9) && Math.abs(cf('female', 'male')) < 1e-9
      && near(cf('male', 'maleFemale'), r, 1e-9);
  })());

  section('Block 7 · generation means, variances and heterosis');
  /* statistics typed from a published table: n, mean and variance among individuals */
  const genStats = tab => tab.map(([gen, n, mean, v]) => ({ gen, n, mean, varWithin: v, dfWithin: n - 1, varMean: v / n, seMean: Math.sqrt(v / n), dfMean: n - 1, basis: 'plants' }));
  const gale1 = genStats([['P1', 10, 13.955, 1.6686], ['P2', 10, 7.575, 0.6596], ['F1', 20, 11.570, 0.5630], ['F2', 40, 11.501, 2.1184], ['BC1', 40, 13.603, 3.0806], ['BC2', 40, 9.219, 1.2957]]);
  const gale2 = genStats([['P1', 10, 11.877, 0.2044], ['P2', 10, 12.910, 0.9454], ['F1', 20, 13.547, 0.6403], ['F2', 40, 12.217, 2.0899], ['BC1', 20, 11.840, 2.5109], ['BC2', 20, 13.015, 2.1087]]);
  const G3 = GEN.fit(gale1, ['m', 'd', 'h'], 'MJ');
  const est3 = k => G3.est.find(e => e.key === k);
  check('Gale et al. (1977) set 1: joint scaling test χ²₃ = 9.4378, P = 2.40 % (published)',
    near(G3.chi2, 9.4381, 5e-4) && G3.df === 3 && near(G3.p, 0.0240, 2e-4), `${G3.chi2.toFixed(4)} · ${G3.p.toFixed(4)}`);
  check('Gale et al. (1977) set 1: m 11.0036 ± 0.1914, [d] 3.6349 ± 0.1924, [h] 0.5937 ± 0.2813 (published)',
    near(est3('m').value, 11.0036, 1e-4) && near(est3('m').se, 0.1914, 1e-4) && near(est3('d').value, 3.6349, 1e-4) && near(est3('d').se, 0.1924, 1e-4)
    && near(est3('h').value, 0.5937, 1e-4) && near(est3('h').se, 0.2813, 1e-4));
  check('Gale et al. (1977) set 2: χ²₃ = 12.5731, P = 0.57 % (published)',
    (() => { const f = GEN.fit(gale2, ['m', 'd', 'h'], 'MJ'); return near(f.chi2, 12.5731, 1e-4) && near(f.p, 0.00566, 1e-4); })());
  const PMJ = GEN.fit(gale1, GEN.PARAMS, 'MJ'), PH = GEN.fit(gale1, GEN.PARAMS, 'H');
  const pv = (f, k) => f.est.find(e => e.key === k).value;
  check('set 1, perfect fit in the F∞ metric: m 11.125, [d] 3.190, [h] 1.059, [i] −0.360, [j] 2.388, [l] −0.614',
    [['m', 11.125], ['d', 3.19], ['h', 1.059], ['i', -0.36], ['j', 2.388], ['l', -0.614]].every(([k, v]) => near(pv(PMJ, k), v, 1e-9)) && PMJ.df === 0);
  check('set 1, perfect fit in Hayman\'s F₂ metric: m 11.501, d 4.384, h 0.445, i −0.360, j 1.194, l −0.614',
    [['m', 11.501], ['d', 4.384], ['h', 0.445], ['i', -0.36], ['j', 1.194], ['l', -0.614]].every(([k, v]) => near(pv(PH, k), v, 1e-9)));
  check('the two metrics are one reparametrisation: same χ² and m_F∞ = m − ½h + ¼l, [d] = d − j, [h] = h − l, [j] = 2j',
    near(GEN.fit(gale1, ['m', 'd', 'h'], 'H').chi2, G3.chi2, 1e-9)
    && (() => { const t = GEN.toMJ(PH.est); return near(t.m, pv(PMJ, 'm'), 1e-9) && near(t.d, pv(PMJ, 'd'), 1e-9) && near(t.h, pv(PMJ, 'h'), 1e-9) && near(t.j, pv(PMJ, 'j'), 1e-9) && near(t.l, pv(PMJ, 'l'), 1e-9); })());
  check('perfect fit in closed form: [h] = 6B₁ + 6B₂ − 8F₂ − F₁ − 1.5P₁ − 1.5P₂ and [l] = P₁ + P₂ + 2F₁ + 4F₂ − 4B₁ − 4B₂',
    (() => { const m = k => gale1.find(s => s.gen === k).mean; return near(pv(PMJ, 'h'), 6 * m('BC1') + 6 * m('BC2') - 8 * m('F2') - m('F1') - 1.5 * m('P1') - 1.5 * m('P2'), 1e-9) && near(pv(PMJ, 'l'), m('P1') + m('P2') + 2 * m('F1') + 4 * m('F2') - 4 * m('BC1') - 4 * m('BC2'), 1e-9); })());
  const SC = GEN.scaling(gale1);
  const sc = k => SC.find(x => x.key === k);
  check('scaling tests: A = 2B₁ − P₁ − F₁ = 1.681, D = 2F₂ − B₁ − B₂ = 0.180, and V_A = 4V(B̄₁) + V(P̄₁) + V(F̄₁)',
    near(sc('A').value, 1.681, 1e-9) && near(sc('D').value, 0.18, 1e-9) && near(sc('A').se * sc('A').se, 4 * 3.0806 / 40 + 1.6686 / 10 + 0.5630 / 20, 1e-12));
  check('scaling tests estimate their epistatic combinations: D = −½[i], C − 4D = −[l] and A − B = [j] (F∞ metric, perfect fit)',
    near(sc('D').value, -0.5 * pv(PMJ, 'i'), 1e-9) && near(sc('C').value - 4 * sc('D').value, -pv(PMJ, 'l'), 1e-9) && near(sc('A').value - sc('B').value, pv(PMJ, 'j'), 1e-9));
  /* Mather (1949) Table 6: tomato loculus number, test A */
  const mat49 = genStats([['P1', 1, 5.5, 0.08 * 0.08], ['F1', 1, 5.475, 0.067 * 0.067], ['BC1', 1, 5.575, 0.064 * 0.064]]);
  check('Mather (1949) Table 6: A = 0.175 with SE 0.164 from the rounded errors (published)',
    (() => { const a = GEN.scaling(mat49).find(x => x.key === 'A'); return near(a.value, 0.175, 1e-9) && near(a.se, 0.1643, 2e-3); })());

  /* Lande (1981) Table 3: tomato fruit weight on log scale (Powers 1942) */
  const lande = genStats([['P1', 420, -0.137, 0.0165], ['BC1', 932, 0.249, 0.0339], ['F1', 475, 0.710, 0.0144], ['F2', 932, 0.653, 0.0570], ['BC2', 931, 1.163, 0.0344], ['P2', 456, 1.689, 0.0165]]);
  const LF = GEN.factors(lande);

    near(lf('a').n, 9.784, 2e-3) && near(lf('b').n, 10.031, 2e-3) && near(lf('c').n, 9.120, 2e-3) && near(lf('d').n, 11.144, 2e-3)
    && near(lf('a').se, 0.650, 2e-3) && near(lf('b').se, 0.661, 2e-3) && near(lf('c').se, 1.148, 2e-3) && near(lf('d').se, 0.767, 2e-3),
    LF.list.map(x => `${x.n.toFixed(3)} ± ${x.se.toFixed(3)}`).join(' / '));
  check('Cockerham (1986): the unweighted combined σ²s = 0.2(4V_F₂ + V_B₁ + V_B₂) − 0.4(V_P₁ + V_P₂ + V_F₁)',
    near(LF.cockerham.sigma2s, 0.2 * (4 * 0.0570 + 0.0339 + 0.0344) - 0.4 * (0.0165 + 0.0165 + 0.0144), 1e-12));

  /* the variance components against their expectations */
  check('variances: with V_F₂, V_B₁, V_B₂ and E known the perfect fit is D = 4V_F₂ − 2(V_B₁ + V_B₂), H = 4(V_B₁ + V_B₂ − V_F₂ − E), F = V_B₂ − V_B₁', (() => {
    const st = genStats([['P1', 50, 10, 2], ['P2', 50, 8, 2], ['F1', 50, 9.5, 2], ['F2', 200, 9.2, 6], ['BC1', 100, 9.8, 4.5], ['BC2', 100, 8.6, 5.3]]);
    const V = GEN.varComponents(st, { weighted: false });
    /* E is the mean of the three non-segregating variances, all equal to 2 here */
    return near(V.D, 4 * 6 - 2 * (4.5 + 5.3), 1e-9) && near(V.H, 4 * (4.5 + 5.3 - 6 - 2), 1e-9) && near(V.F, 5.3 - 4.5, 1e-9) && near(V.E, 2, 1e-9);
  })());
  check('Warner (1952): narrow-sense h² = [2V_F₂ − (V_B₁ + V_B₂)]/V_F₂ equals ½D/V_F₂ of the same fit', (() => {
    const st = genStats([['P1', 50, 10, 2], ['P2', 50, 8, 2], ['F1', 50, 9.5, 2], ['F2', 200, 9.2, 6], ['BC1', 100, 9.8, 4.5], ['BC2', 100, 8.6, 5.3]]);
    const V = GEN.varComponents(st, { weighted: false });

  })());

  /* heterosis */
  const HT = GEN.heterosis(gale1);
  const ht = k => HT.list.find(x => x.key === k);
  check('heterosis: F₁ − MP = 0.805 with SE √[V(F̄₁) + ¼V(P̄₁) + ¼V(P̄₂)], and the potence ratio (2F₁ − P₁ − P₂)/|P₁ − P₂|',
    near(ht('mph').value, 11.570 - (13.955 + 7.575) / 2, 1e-12) && near(ht('mph').se, Math.sqrt(0.5630 / 20 + 0.25 * 1.6686 / 10 + 0.25 * 0.6596 / 10), 1e-12)
    && near(HT.potence.value, (2 * 11.570 - 13.955 - 7.575) / Math.abs(13.955 - 7.575), 1e-12));
  check('heterosis in terms of the model: F₁ − MP = [h] + [l] − [i] in the F∞ metric and h − i in Hayman\'s',
    near(ht('mph').value, pv(PMJ, 'h') + pv(PMJ, 'l') - pv(PMJ, 'i'), 1e-9) && near(ht('mph').value, pv(PH, 'h') - pv(PH, 'i'), 1e-9));

  /* the example rebuilt from the published moments, through the whole pipeline */
  const galeEx = loaded.gale77;
  const galeRows = [];
  (() => {
    const t = galeEx.ds.traits[0];
    const ent = new Map(Data.entryTable(galeEx.ds).map(e => [e.name, e]));
    const E = galeEx.rec.field.envs[0];
    Trial.plots(galeEx.ds, E.key, t, {}).plots.forEach(p => { const e = ent.get(p.entry); if (e && e.generation) p.vals.forEach(v => galeRows.push({ gen: e.generation, block: '', plot: p.key, y: v })); });
  })();
  const GA = GEN.analyse({ rows: galeRows, metric: 'MJ', order: Data.GEN_ORDER });
  check('gale77 example: the rebuilt plants keep n, mean and variance of every generation and give χ² = 9.4381',
    GA.stats.length === 6 && gale1.every(s => { const x = GA.stats.find(y => y.gen === s.gen); return x && x.n === s.n && near(x.mean, s.mean, 1e-10) && near(x.varWithin, s.varWithin, 1e-10); })
    && near(GA.models.list[0].chi2, 9.4381, 5e-4));

  /* the simulated generations: the truth is inside the confidence region */
  const simEx = loaded.simGen;
  const simRows = [];
  (() => {
    const t = simEx.ds.traits[0];
    const ent = new Map(Data.entryTable(simEx.ds).map(e => [e.name, e]));
    const E = simEx.rec.field.envs[0];
    Trial.plots(simEx.ds, E.key, t, {}).plots.forEach(p => { const e = ent.get(p.entry); if (e && e.generation) p.vals.forEach(v => simRows.push({ gen: e.generation, block: (E.blockAsRep ? p.block : p.rep) || '', plot: p.key, y: v })); });
  })();
  const SA = GEN.analyse({ rows: simRows, metric: 'MJ', order: Data.GEN_ORDER });
  check('simGen: with replicated plots the variance of a mean comes from the plot means (3 per generation)',
    SA.stats.every(s => s.basis === 'plots' && s.nPlots === 3));
  check('simGen: [d] of the perfect fit is within two standard errors of the true 8, and E within two of 4',
    (() => { const d = SA.perfect.est.find(e => e.key === 'd'); const E = SA.variances.list.find(c => c.key === 'E'); return Math.abs(d.value - 8) < 2 * d.se && Math.abs(E.value - 4) < 2 * E.se; })());
  /* the blocks are shared by every generation: they must not enter the variances of the means */
  check('simGen: V(mean) = σ²p·Σk²/n² + s²/n with σ²p = 1.30328 − 0.37505 from the plot means without blocks: P₁ 0.44496, F₂ 0.40723 (R, and REML 0.44484, 0.40838)',
    near(SA.stats.find(s => s.gen === 'P1').varMean, 0.4449588824640538, 1e-9) && near(SA.stats.find(s => s.gen === 'F2').varMean, 0.40723470155237285, 1e-9)
    && near(SA.stats.find(s => s.gen === 'P1').dfMean, 10.207453799155669, 1e-7));
  check('adding 10 to every plant of one block changes no variance of a mean, no χ² and no estimate but m',
    (() => { const shifted = simRows.map(r => Object.assign({}, r, { y: r.y + (r.block === simRows[0].block ? 10 : 0) }));
      const B = GEN.analyse({ rows: shifted, metric: 'MJ', order: Data.GEN_ORDER });
      return B.stats.every((s, k) => near(s.varMean, SA.stats[k].varMean, 1e-9)) && B.models.list.every((m, k) => near(m.chi2, SA.models.list[k].chi2, 1e-7)); })());
  check('simGen: with plot means the p of m, [d], [h] is Welch–James (Johansen 1980): χ² 12.4645, p 0.019460 (R)',
    (() => { const m = SA.models.list[0]; return m.test === 'WJ' && near(m.chi2, 12.464452646636873, 1e-7) && near(m.p, 0.019459691033056781, 1e-8); })());
  /* standard heterosis: the check written in the generation column enters only that contrast */
  const ckRows = simRows.slice();
  (() => {
    const t = simEx.ds.traits[0], E = simEx.rec.field.envs[0];
    Trial.plots(simEx.ds, E.key, t, {}).plots.forEach(p => { if (p.entry === 'Testigo') p.vals.forEach(v => ckRows.push({ gen: 'CK:Testigo', block: (E.blockAsRep ? p.block : p.rep) || '', plot: p.key, y: v })); });
  })();

  const Th11 = TP11.rows.map(r => ({ p1: String(r[0]), p2: String(r[1]), y: +r[2] }));
  const Tsub11 = ids => { const idx = new Map(TQ11.ids.map((id, i) => [id, i])), m = TQ11.m, n = ids.length, M = new Float64Array(n * m), p = new Float64Array(m); ids.forEach((id, r) => { for (let j = 0; j < m; j++) { M[r * m + j] = TQ11.M[idx.get(id) * m + j]; p[j] += M[r * m + j] / (2 * n); } }); return GS.kernel(GS.G({ n, m, M, p, ids }, {}).G, n, { ridge: 0.001 }).K; };
  const T1i11 = [...new Set(Th11.map(h => h.p1))], T2i11 = [...new Set(Th11.map(h => h.p2))];
  const TH11 = GS.hybrid(Th11, T1i11, Tsub11(T1i11), T2i11, Tsub11(T2i11), {});
  check('Technow et al. (2014), 1254 Dent × Flint hybrids, grain yield: σ²GCA dent 16.6942, flint 10.6027, σ²e 17.7859 (R, general optimiser: the same to 1e-4)',
    near(TH11.theta[0], 16.6942, 1e-3) && near(TH11.theta[1], 10.6027, 1e-3) && near(TH11.theta[2], 17.7859, 1e-3), Array.from(TH11.theta).map(v => v.toFixed(4)).join(' '));
  const hcv11 = await GS.hybridCV(Th11, T1i11, Tsub11(T1i11), T2i11, Tsub11(T2i11), { folds: 5, reps: 1, seed: 3 });
  check('hybrid cross-validation: both schemes predict every hybrid once; the classes T2 + T1 + T0 add up to both schemes; T2 > T1 in predictive ability',
    hcv11.hybrids.n === 1254 && hcv11.lines.n === 1254 && hcv11.T2.n + hcv11.T1.n + hcv11.T0.n === 2508 && hcv11.T2.r > hcv11.T1.r, `${hcv11.T2.n} ${hcv11.T1.n} ${hcv11.T0.n} r ${hcv11.T2.r.toFixed(3)} ${hcv11.T1.r.toFixed(3)} ${hcv11.T0.r.toFixed(3)}`);

  /* Jenkins (1934) and the response per year */
  const jl11 = ['A', 'B', 'C', 'D'], js11 = { AC: 100, AD: 104, BC: 96, BD: 110 };

  check('gain per year i·r·σA/L (Heffner et al. 2010): phenotypic 1.755 × 0.6 × 2/4 = 0.5265, genomic 1.755 × 0.5 × 2/1.5 = 1.17', near(rp11.pheno, 0.5265, 1e-12) && near(rp11.genomic, 1.17, 1e-12));

  const fc11 = { width: 700, height: 520, theme: 'light', palette: 'breeding', font: 'sans', colormap: 'heat' };
  const figs11 = [
    ['MAF histogram', () => P11.hist(fc11, wQ11.maf, { titleEs: 'MAF', titleEn: 'MAF', xlab: 'MAF', lo: 0, hi: 0.5, bins: 25 })],
    ['principal components', () => P11.pca(fc11, GS.pca(smG11.G, 4, 2), sm11.ids, ['g1', 'g1', 'g2', 'g2'])],
    ['relationship matrix', () => P11.matrix(fc11, { M: smG11.G, rows: sm11.ids, cols: sm11.ids, titleEs: 'G', titleEn: 'G', colormap: 'heat', barLabel: 'G' })],
    ['scatter with 1:1 line', () => P11.scatter(fc11, { x: [1, 2, 3, 4], y: [1.2, 1.9, 3.3, 3.8], labels: ['a', 'b', 'c', 'd'], xlab: 'x', ylab: 'y', sameScale: true, titleEs: 'x', titleEn: 'x' })],

  ];
  const badFig11 = figs11.filter(([, f]) => { try { const s = f(); const h = s.outerHTML || String(s); return !/^<svg/.test(h) || /NaN|undefined/.test(h); } catch (e) { return true; } }).map(x => x[0]);
  check('Block 11 figures draw without NaN or undefined (histogram, components, matrix, scatter, marker effects, cross-validation)', !badFig11.length, badFig11.join(', '));

  section('Block 12 · report, methods and package');
  const enc12 = new TextEncoder();
  check('ZIP: CRC-32 of the standard check strings ("The quick brown fox…" = 414FA339, "123456789" = CBF43926, empty = 0)',
    Zip.crc32(enc12.encode('The quick brown fox jumps over the lazy dog')) === 0x414FA339 && Zip.crc32(enc12.encode('123456789')) === 0xCBF43926 && Zip.crc32(new Uint8Array(0)) === 0);
  const zb12 = new Uint8Array(await (await Zip.build([{ name: 'a/tabla ñ.csv', data: 'x,y\n1,2\n' }, { name: 'b.bin', data: new Uint8Array([0, 255, 7]) }])).arrayBuffer());
  const dv12 = new DataView(zb12.buffer), end12 = zb12.length - 22;
  const nm12 = enc12.encode('a/tabla ñ.csv');
  const cdOff12 = dv12.getUint32(end12 + 16, true), cdSize12 = dv12.getUint32(end12 + 12, true);
  check('ZIP: local header, UTF-8 name (flag 0x0800), stored data, central directory and end record agree',
    dv12.getUint32(0, true) === 0x04034b50 && dv12.getUint16(6, true) === 0x0800 && dv12.getUint16(26, true) === nm12.length
    && new TextDecoder().decode(zb12.subarray(30, 30 + nm12.length)) === 'a/tabla ñ.csv' && new TextDecoder().decode(zb12.subarray(30 + nm12.length, 30 + nm12.length + 8)) === 'x,y\n1,2\n'
    && dv12.getUint32(14, true) === Zip.crc32(enc12.encode('x,y\n1,2\n')) && dv12.getUint32(end12, true) === 0x06054b50 && dv12.getUint16(end12 + 10, true) === 2
    && dv12.getUint32(cdOff12, true) === 0x02014b50 && cdOff12 + cdSize12 === end12, `${zb12.length} bytes`);

  /* citations in both languages */
  const lang12 = I18N.lang;
  I18N.lang = 'es';
  const es12 = [MT.c('tukey49'), MT.c('comstock48'), MT.c('knapp85'), MT.p('eberhart66', 'shukla72')];
  I18N.lang = 'en';
  const en12 = [MT.c('comstock48'), MT.cp('gollob68'), MT.cp('cornelius92'), MT.p('finlay63')];
  I18N.lang = lang12;
  check('citations: "Tukey (1949)", "Comstock y Robinson (1948)", "Knapp et al. (1985)", "(Eberhart y Russell 1966; Shukla 1972)"; in English "&" and possessives "Gollob\'s (1968)", "Cornelius et al.\'s (1992)"',
    es12.join('|') === 'Tukey (1949)|Comstock y Robinson (1948)|Knapp et al. (1985)|(Eberhart y Russell 1966; Shukla 1972)'
    && en12.join('|') === "Comstock & Robinson (1948)|Gollob's (1968)|Cornelius et al.'s (1992)|(Finlay & Wilkinson 1963)", es12.concat(en12).join(' | '));
  /* a letter after the year only when two works of the same authors and year are both cited */
  const saved12 = MT.blocks[2], lang12b = I18N.lang;
  I18N.lang = 'es';
  MT.blocks[2] = () => `<p>${MT.c('griffing56b')}; ${MT.p('hayman54a', 'hayman54b')}.</p>`;
  const yr12 = MT.build([2]);
  MT.blocks[2] = saved12; I18N.lang = lang12b;
  check('citation years: "Griffing (1956)" alone loses its letter, text and list; "Hayman 1954a; Hayman 1954b" keep theirs; none uncited',
    /Griffing \(1956\)/.test(yr12.html) && !/1956b/.test(yr12.html + yr12.refs.join('') + yr12.text) && /Hayman 1954a; Hayman 1954b/.test(yr12.html)
    && yr12.refs.some(r => r.startsWith('Griffing B (1956).')) && yr12.refs.some(r => r.startsWith('Hayman BI (1954a)')) && MT.check(yr12).uncited.length === 0, yr12.html);
  const regBad12 = Object.entries(MT.REF).filter(([k, r]) => !r.full.startsWith(r.a[0].split(' ').pop() === r.a[0] ? r.a[0] : r.a[0]) || !r.full.includes(`(${r.y})`)).map(([k]) => k);
  const soft12 = Object.entries(MT.REF).filter(([k, r]) => /\b(software|package|paquete|macro)\b/i.test(r.full)).map(([k]) => k);
  check(`reference registry: ${Object.keys(MT.REF).length} references, each starting with its first author and carrying its year; none cites a software package`, !regBad12.length && !soft12.length, regBad12.concat(soft12).join(', '));
  const fake12 = { data: '', html: '<p>La prueba de Tukey (1949) y la ecovalencia (Wricke 1962).</p>', keys: ['tukey49', 'wricke62', 'bartlett37'] };
  const chk12 = MT.check(fake12);
  check('methods check: a reference in the list that the text never cites is caught (Bartlett 1937), the cited ones pass', chk12.uncited.length === 1 && chk12.uncited[0] === 'bartlett37', JSON.stringify(chk12));
  check('software citation: author, year, version, kind and DOI', /^Barrera-Guzmán, L\.Á\. \(2026\)\. BreedingPro: .+ \((versión|Version) \d+\.\d+\.\d+\) \[(software|Computer software)\]\. https:\/\/doi\.org\/10\.5281\/zenodo\.\d+$/.test(RP.citation()), RP.citation());

  const names = Object.keys(Art).filter(k => typeof Art[k] === 'function' && !['ear', 'cow'].includes(k));

  document.getElementById('sum').textContent = `${pass} passed, ${fail} failed`;

  window.TEST_RESULT = { pass, fail };
})();
